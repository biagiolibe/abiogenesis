[package]
name = "abiogenesis"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.19", features = ["file_watcher"] }
bevy_common_assets = { version = "0.17.0", features = ["ron"] }
bevy_egui = "0.41"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
