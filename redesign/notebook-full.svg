  <rect x="714" y="156" width="30" height="30" rx="5" fill="none" stroke="#2a2c34" stroke-width="0.5"/>
  <rect x="750" y="156" width="30" height="30" rx="5" fill="none" stroke="#2a2c34" stroke-width="0.5"/>
