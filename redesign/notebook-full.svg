    <path d="M204,344 Q252,368 300,344" fill="none" stroke="#888780" stroke-width="0.8" marker-end="url(#arrowNb)"/>
    <line x1="240" y1="292" x2="164" y2="330" stroke="#EF9F27" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrowNb)"/>
