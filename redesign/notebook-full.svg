  <line x1="24" y1="30" x2="24" y2="30" stroke="none"/>
  <line x1="24" y1="30" x2="24" y2="30" stroke="none"/>
  <line x1="24" y1="430" x2="200" y2="430" stroke="none"/>
  <text x="24" y="432" font-size="9.5" fill="#6b6d75"><tspan fill="#E24B4A">&#8212;</tspan> confermata</text>
  <text x="120" y="432" font-size="9.5" fill="#6b6d75"><tspan fill="#EF9F27">&#8226;&#8226;&#8226;</tspan> ipotesi neg.</text>
  <text x="230" y="432" font-size="9.5" fill="#6b6d75"><tspan fill="#639922">&#8226;&#8226;&#8226;</tspan> ipotesi pos.</text>
  <text x="340" y="432" font-size="9.5" fill="#6b6d75">tratteggio nodo = non osservata</text>

  <line x1="24" y1="450" x2="456" y2="450" stroke="#23262e" stroke-width="0.5"/>

