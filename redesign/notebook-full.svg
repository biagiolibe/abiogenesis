    <circle cx="300" cy="392" r="18" fill="none" stroke="#565b64" stroke-width="0.5"/>
    <text x="300" y="392" font-size="11" fill="#8f9199" text-anchor="middle" dominant-baseline="central">&#954;</text>
    <circle cx="164" cy="330" r="18" fill="none" stroke="#565b64" stroke-width="0.5"/>
    <text x="164" y="330" font-size="11" fill="#8f9199" text-anchor="middle" dominant-baseline="central">&#945;</text>
  </g>

