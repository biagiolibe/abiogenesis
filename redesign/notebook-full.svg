  <rect x="678" y="90" width="60" height="20" rx="4" fill="none" stroke="#2a2c34" stroke-width="0.5"/>
  <text x="708" y="103" font-size="9" fill="#c8c9ce" text-anchor="middle">&#9654; pulse</text>
  <line x1="678" y1="126" x2="802" y2="126" stroke="#23262e" stroke-width="0.5"/>
